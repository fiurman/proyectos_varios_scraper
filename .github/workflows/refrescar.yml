name: Refrescar catalogo

# Corre solo todos los dias y tambien a mano desde el boton "Run workflow",
# que sirve desde el celular cuando queres los precios de ahora.
on:
  schedule:
    # En UTC: las 20:00 son las 17:00 en Argentina. GitHub no entiende de
    # zonas horarias y no ajusta por horario de verano.
    - cron: '0 20 * * *'
  workflow_dispatch:

# Si una corrida se solapa con la anterior, se descarta la nueva en vez de
# correr las dos contra la misma base. Es el equivalente al archivo candado
# que usa el script cuando corre en una maquina propia.
concurrency:
  group: refrescar
  cancel-in-progress: false

jobs:
  refrescar:
    runs-on: ubuntu-latest
    # El refresco tarda unas dos horas. El tope por defecto son 6, pero se
    # deja explicito: si algo se cuelga, que muera y no se coma la cuota.
    timeout-minutes: 180

    # Postgres corriendo al lado, en el mismo runner.
    #
    # La primera version usaba una base en la nube y la corrida se fue a 3
    # horas: `persist.ts` hace unas veinte consultas por producto y cada una
    # cruzaba el continente. Solo La Coope tardo 2h29 contra los 17 minutos que
    # tarda contra una base local. El scrapeo nunca fue el problema.
    #
    # El estado no se pierde: se restaura de un respaldo en R2 al empezar y se
    # vuelve a subir al terminar.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: precios
          POSTGRES_PASSWORD: precios
          POSTGRES_DB: precios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://precios:precios@localhost:5432/precios
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: ${{ secrets.R2_PREFIX }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}

    steps:
      # Primero de todo, antes incluso de bajar el codigo: es la unica señal de
      # que la tarea se disparo. Sin esto, dos horas de silencio son iguales a
      # que el cron no haya corrido, y de eso uno se entera al dia siguiente.
      - name: Avisar que arranco
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          CORRIDA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXTO="$(printf '🛒 precios_varios: arranco el refresco (%s). Suele tardar unas 2 horas.\n\nVer: %s' \
                    "$(TZ=America/Argentina/Buenos_Aires date '+%H:%M')" "$CORRIDA")"
          curl -sS -m 20 -o /dev/null \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXTO" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Traer el estado anterior
        run: |
          sudo apt-get install -y -qq postgresql-client
          npm run --silent respaldos -- bajar estado.dump || true
          if [ ! -s estado.dump ]; then
            echo "  Sin respaldo previo: se arranca de una base vacia."
            exit 0
          fi
          # El dump trae el esquema, asi que entra en una base recien creada.
          # Los avisos de "no existe" son normales con --clean sobre vacio.
          pg_restore -d "$DATABASE_URL" --no-owner --clean --if-exists estado.dump 2>&1 \
            | grep -viE "does not exist|already exists" | head -5 || true
          psql "$DATABASE_URL" -tAc "select 'restaurado: ' || count(*) || ' productos' from products"

      - name: Migraciones
        run: npm run migrate -w @precios/db

      # Barato y sin efecto cuando ya estan bien. Sirve la vez que la base se
      # restaura de un respaldo: ahi los contadores quedan en cero y el primer
      # insert choca contra lo restaurado, a mitad del scrapeo y con un error
      # que no dice que el problema son las secuencias.
      - name: Reponer contadores de id
        run: npm run secuencias

      - name: Refrescar
        id: refresco
        run: |
          set -o pipefail
          npm run refrescar 2>&1 | tee salida.log

      # Se manda igual haya salido bien o mal: un aviso que no llega no se
      # distingue de uno que se rompio en silencio.
      - name: Avisar por Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          if [ "${{ steps.refresco.outcome }}" = "success" ]; then
            ICONO="✅"; TITULO="catalogo actualizado"
          else
            ICONO="❌"; TITULO="el refresco fallo"
          fi
          # Las lineas de resultado de cada cadena tienen la forma
          # "[hh:mm:ss] clave: N productos". Se reconocen por la forma y no por
          # el nombre, asi una cadena nueva aparece sola.
          RESUMEN="$(grep -E '^\[[0-9:]+\] ([a-z_]+: ([0-9]|FALLO)|Listo|Error)' salida.log | tail -8)"
          CORRIDA="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # printf y no comillas con saltos adentro: un salto de linea a la
          # izquierda del todo cierra el bloque y rompe el YAML entero.
          TEXTO="$(printf '%s precios_varios: %s\n\n%s\n\nVer: %s' "$ICONO" "$TITULO" "$RESUMEN" "$CORRIDA")"
          curl -sS -m 20 -o /dev/null \
            -d "chat_id=$TG_CHAT" \
            --data-urlencode "text=$TEXTO" \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage"

      # Solo si el refresco salio bien: un estado a medias es peor que el
      # anterior entero.
      - name: Guardar el estado
        if: steps.refresco.outcome == 'success'
        run: npm run respaldar

      # Queda guardado por si hay que mirar que paso dias despues.
      - name: Guardar el log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_id }}
          path: salida.log
          retention-days: 14
