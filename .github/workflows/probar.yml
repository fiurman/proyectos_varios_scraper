name: Probar conexiones

# Una corrida corta para verificar que los secrets estan bien cargados y que
# se llega a la base y a R2. Antes de esto, la unica forma de enterarse de un
# secret mal copiado era esperar dos horas a que fallara el refresco entero.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PREFIX: ${{ secrets.R2_PREFIX }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Que ningun secret quedo vacio
        run: |
          falta=0
          for v in DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                   R2_BUCKET R2_PREFIX R2_PUBLIC_BASE; do
            # A una variable intermedia: bash no deja pedir el largo y la
            # referencia indirecta en la misma expansion.
            valor="${!v}"
            if [ -n "$valor" ]; then
              # Solo el largo, nunca el valor.
              echo "  $v ok (${#valor} caracteres)"
            else
              echo "  $v VACIO"
              falta=1
            fi
          done
          # Se recorren todos antes de cortar: si hay tres mal cargados,
          # conviene enterarse de los tres de una y no de a uno por corrida.
          [ "$falta" -eq 0 ] || exit 1

      - name: La base responde y tiene los datos
        run: npm run comprobar

      - name: Se puede escribir en R2
        run: npm run scrape -- coope 5 && npm run snapshot && npm run publicar
