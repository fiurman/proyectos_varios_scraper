services:
  db:
    image: pgvector/pgvector:pg16
    container_name: precios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-precios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-precios_dev}
      POSTGRES_DB: ${POSTGRES_DB:-precios}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-precios} -d ${POSTGRES_DB:-precios}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
